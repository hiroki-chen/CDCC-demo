[workspace]
resolver = "2"
members = [
  "host",
  "policy-styx-lib",
  "policy-styx-runner",
  "sandbox-apps/cox-demo",
  "sandbox-apps/polars-demo",
  "sandbox-apps/policy-styx",
]

[workspace.dependencies]
anyhow = { version = "1.0.95", default-features = false }
chrono = { version = "0.4.41", default-features = false }
libc = "0.2.172"
polars = { git = "https://github.com/hiroki-chen/polars.git", default-features = false, features = [
  "lazy",
  "polars-io",
  "ipc",
  "dtype-categorical",
  "round_series",
  "parquet",
  "to_dummies",
  "is_in",
  "temporal",
  "cross_join",
  "dtype-date",
  "regex",
  "strings",
  "dtype-datetime",
] }
policy-styx-lib = { path = "policy-styx-lib" }
policy-styx = { path = "policy-styx" }
tdx = { version = "0.1.0", git = "https://github.com/hiroki-chen/tdx-attestation-sdk.git" }
dcap-rs = { git = "https://github.com/automata-network/dcap-rs.git" }
