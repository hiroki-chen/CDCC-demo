[workspace]
resolver = "2"
members = [
  "frontend",
  "policy-styx-lib",
  "policy-styx-runner",
  "sandbox-apps/cox-demo",
  "sandbox-apps/polars-demo",
  "sandbox-apps/policy-styx",
]

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false }
polars = { git = "https://github.com/hiroki-chen/polars.git", default-features = false, features = [
  "lazy",
  "polars-io",
  "ipc",
  "dtype-categorical",
  "round_series",
  "parquet",
  "to_dummies",
  "is_in",
  "temporal",
  "cross_join",
  "dtype-date",
  "regex",
  "strings",
  "dtype-datetime",
] }
policy-styx-lib = { path = "policy-styx-lib" }
policy-styx = { path = "policy-styx" }

