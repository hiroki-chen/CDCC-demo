[package]
name = "policy-styx-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = { version = "0.10.3" }
anyhow = { workspace = true }
bincode = { workspace = true }
dcap-rs = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { version = "0.10.8", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
tdx = { workspace = true, optional = true }
uuid = { workspace = true }
wasi-common = { version = "29.0.1", optional = true }
wasmtime = { version = "29.0.1", features = ["runtime"], optional = true }

[features]
default = ["platform-tdx", "runtime"]
runtime = ["wasmtime", "wasi-common"]
platform-tdx = ["tdx", "dcap-rs", "libc"]

# Add customized rust source file as test
[[test]]
name = "integration"
path = "../test/test_sandboxes.rs"
