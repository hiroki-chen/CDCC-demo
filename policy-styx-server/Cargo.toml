[package]
name = "policy-styx-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
dcap-rs = { workspace = true, optional = true }
env_logger = "0.11.8"
policy-styx-proto = { workspace = true }
policy-styx-lib = { workspace = true }
log = "0.4.27"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tonic = "*"
p256 = { version = "0.13.2", features = ["ecdh"] }
rand_core = { version = "0.9.3", features = ["os_rng"] }

[features]
default = ["platform-tdx"]
platform-tdx = ["dcap-rs"]
