[package]
name = "policy-styx-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
dcap-rs = { workspace = true, optional = true }
env_logger = "0.11.8"
policy-styx-lib = { workspace = true, optional = true, features = [
  "platform-tdx",
] }
log = "0.4.27"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
# tonic = "*"
p256 = { version = "0.13.2", features = ["ecdh"] }
rand_core = { version = "0.9.3", features = ["os_rng"] }
axum = { version = "0.8.4", features = ["multipart"] }
serde = { version = "1.0.219", features = ["derive"] }
tower-http = { version = "0.6.6", features = ["cors"] }
base64-serde = "0.8.0"
serde_with = { version = "3.12.0", features = ["base64"] }
sudo = { version = "0.6.0", optional = true }
uuid = { version = "1.17.0", features = ["serde"] }
wasi-common = "=29.0.1"

[features]
default = ["platform-tdx"]
platform-tdx = ["dcap-rs", "sudo", "policy-styx-lib"]
mock = []
